<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">

<title>El Plan de Salvación</title>
<style>
  @font-face { font-family:"Patrick Hand"; font-style:normal; font-weight:400; font-display:swap; src:url(/fonts/patrick-hand-400.woff2) format("woff2"); }
  :root { --ground:#F4ECD8; --main:#2B4C7E; --second:#2A2622; --accent:#D9822B; }
  /* ---------- Reproductor (escala el lienzo de 1920×1080 a cualquier tamaño) ---------- */
  html, body { margin:0; height:100%; background:var(--ground); }
  #player { position:relative; width:100%; height:100%; overflow:hidden; background:var(--ground); user-select:none; -webkit-user-select:none; }
  #frame { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; }
  #stage { position:absolute; inset:0; width:1920px; height:1080px; overflow:hidden;
    --display:"Patrick Hand", "Segoe Print", "Bradley Hand", "Comic Sans MS", cursive;
    --serif:Georgia, "Times New Roman", serif;
    color:var(--second); font-family:var(--serif); }
  .scene { position:absolute; inset:0; display:none } .scene.on { display:block }

  /* ---------- Estilo de la película (papel y tinta) ---------- */
  .ground { position:absolute; inset:0; background:radial-gradient(130% 110% at 50% 45%, var(--ground) 55%, color-mix(in srgb, var(--ground) 88%, var(--second))) }
  .words { position:absolute; margin:0; display:flex; flex-direction:column; gap:22px } .words > * { margin:0 }
  .line { font-family:var(--display); font-size:92px; line-height:1.12; font-weight:400 } .sub { font-size:34px; letter-spacing:.08em }
  .line.long { font-size:70px; line-height:1.14 }
  .sub { color:color-mix(in srgb, var(--second) 68%, var(--ground)); text-transform:uppercase }
  .ref { font-family:var(--display); font-size:46px; letter-spacing:.16em; text-transform:uppercase; color:var(--accent) }
  .step { font-family:var(--display); font-size:32px; letter-spacing:.14em; text-transform:uppercase; color:var(--main) }
  .cite { font-family:var(--display); font-size:32px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent) }
  .pray { font-family:var(--display); font-size:74px; line-height:1.2; font-weight:400 }
  .art { position:absolute; inset:0; width:100%; height:100%; overflow:visible }
  .ink { fill:none; stroke:var(--second); stroke-width:6; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1 1 }
  .ink.thin { stroke-width:3.5 } .ink.bold { stroke-width:10 } .ink.blue { stroke:var(--main) } .ink.warm { stroke:var(--accent) }
  .wash { stroke:none; fill:color-mix(in srgb, var(--main) 38%, var(--ground)) }
  .wash.warm { fill:color-mix(in srgb, var(--accent) 52%, var(--ground)) }
  .wash.soft { fill:color-mix(in srgb, var(--main) 16%, var(--ground)) }
  .wash.sun { fill:color-mix(in srgb, var(--accent) 34%, var(--ground)) }
  .hatch { fill:none; stroke:color-mix(in srgb, var(--second) 55%, var(--ground)); stroke-width:2.5; stroke-linecap:round; stroke-dasharray:1 1 }
  .rule { position:absolute; height:5px; border-radius:3px; background:var(--accent); transform-origin:0 50% }
  .credito { position:absolute; right:60px; top:48px; width:1000px; margin:0; text-align:right; font-family:var(--serif); font-size:22px; line-height:1.4; color:color-mix(in srgb, var(--second) 62%, var(--ground)) }
  .glow { position:absolute; inset:0; background:radial-gradient(55% 55% at 50% 45%, color-mix(in srgb, var(--accent) 30%, transparent), transparent) }

  /* ---------- Controles ---------- */
  #big { position:absolute; left:50%; top:50%; width:110px; height:110px; margin:-55px 0 0 -55px; border:none; border-radius:50%; cursor:pointer;
    background:var(--second); color:var(--ground); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 24px rgba(0,0,0,.25); transition:opacity .25s, transform .25s; }
  #big:hover { transform:scale(1.06) } #big.hide { opacity:0; pointer-events:none }
  #big svg { width:44px; height:44px; margin-left:6px }
  #ctl { position:absolute; left:0; right:0; bottom:0; height:44px; display:flex; align-items:center; gap:10px; padding:0 12px; box-sizing:border-box;
    background:linear-gradient(to top, rgba(42,38,34,.55), rgba(42,38,34,0)); opacity:0; transition:opacity .3s; font:14px/1 system-ui, sans-serif; color:#F4ECD8; }
  #player:hover #ctl, #player.paused #ctl, #player.touch #ctl { opacity:1 }
  #ctl button { background:none; border:none; color:inherit; cursor:pointer; width:28px; height:28px; padding:0; display:flex; align-items:center; justify-content:center }
  #ctl button svg { width:18px; height:18px; fill:currentColor }
  #bar { flex:1; height:18px; position:relative; cursor:pointer }
  #bar::before { content:""; position:absolute; left:0; right:0; top:7px; height:4px; border-radius:2px; background:rgba(244,236,216,.35) }
  #fill { position:absolute; left:0; top:7px; height:4px; border-radius:2px; background:#D9822B; width:0 }
  .tick { position:absolute; top:5px; width:2px; height:8px; background:rgba(244,236,216,.6) }
  #time { font-variant-numeric:tabular-nums; min-width:76px; text-align:right; opacity:.9 }
</style>

/* NARRACION:INICIO */
const SYNC = {"scenes":{"titulo":{"dur":3.2,"anchors":[[0,0],[3.2,3.0]],"marks":{}},"mundo":{"dur":7.2,"anchors":[[0,0],[7.2,5.0]],"marks":{"mundo-step":0.4}},"hijo":{"dur":5.5,"anchors":[[0,0],[5.5,5.5]],"marks":{}},"cruz":{"dur":5.2,"anchors":[[0,0],[5.2,5.0]],"marks":{}},"vida":{"dur":6.0,"anchors":[[0,0],[6.0,4.5]],"marks":{"vida-ref":2.88}},"abundancia":{"dur":8.4,"anchors":[[0,0],[8.4,6.0]],"marks":{"abundancia-cite":5.68}},"pecado":{"dur":11.28,"anchors":[[0,0],[11.28,6.0]],"marks":{"pecado-step":0.4,"pecado-cite":7.76}},"separacion":{"dur":9.28,"anchors":[[0,0],[9.28,6.0]],"marks":{"separacion-cite":5.28}},"puente":{"dur":13.12,"anchors":[[0,0],[13.12,7.0]],"marks":{"puente-step":0.4,"puente-cite":10.16}},"camino":{"dur":10.16,"anchors":[[0,0],[10.16,7.0]],"marks":{"camino-cite":7.12}},"regalo":{"dur":14.8,"anchors":[[0,0],[14.8,8.0]],"marks":{"regalo-step":0.4,"regalo-cite":11.2}},"puerta":{"dur":11.6,"anchors":[[0,0],[11.6,7.5]],"marks":{"puerta-cite":8.08}},"oracion":{"dur":29.68,"anchors":[[0,0],[2.74,0.3],[10.18,5.6],[10.58,6.0],[17.22,11.3],[17.62,11.7],[22.74,15.7],[23.14,16.1],[28.98,20.6],[29.68,21.0]],"marks":{"oracion-step":0.4}},"amen":{"dur":5.0,"anchors":[[0,0],[5.0,5.0]],"marks":{}}},"words":{"El Plan de Salvación":[0.4,0.72,1.04,1.12],"Porque de tal manera amó Dios al mundo,":[3.16,3.48,3.72,3.96,4.44,4.72,5.04,5.24],"que ha dado a su Hijo unigénito,":[0.4,0.56,0.72,1.0,1.12,1.28,1.68],"para que todo aquel que en él cree, no se pierda,":[0.4,0.72,0.96,1.28,1.68,1.84,2.04,2.2,2.88,3.04,3.28],"mas tenga vida eterna.":[0.4,0.72,1.28,1.6],"Yo he venido para que tengan vida, y para que la tengan en abundancia.":[0.4,0.68,0.8,1.28,1.48,1.68,2.16,2.96,3.12,3.28,3.4,3.6,4.08,4.24],"Por cuanto todos pecaron, y están destituidos de la gloria de Dios.":[2.84,3.0,3.6,3.84,4.64,4.72,5.12,5.92,6.04,6.16,6.56,6.68],"Vuestras iniquidades han hecho división entre vosotros y vuestro Dios.":[0.4,0.96,1.76,1.92,2.16,2.84,3.04,3.76,3.84,4.24],"Mas Dios muestra su /* NARRACION:FIN */
const AUDIO_SRC = SYNC ? '/' + SYNC.audio : '';
const PARAMS = new URLSearchParams(location.search);

};
for (const [name, value] of Object.entries(THEMES[PARAMS.get('tema')] ?? {})) document.documentElement.style.setProperty(name, value);

/* ---------- Escenas (orden y duración en segundos) ---------- */
const SCENES = [

  { id: 'regalo', name: 'El regalo', dur: 8 },
  { id: 'puerta', name: 'La puerta', dur: 7.5 },

if (SYNC) for (const s of SCENES) s.dur = SYNC.scenes[s.id].dur;

/* ---------- Mini "kit": utilidades puras en función del tiempo ---------- */
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
let REAL = 0;
const warp = (anchors, x) => {
  for (let i = 1; i < anchors.length; i++) {
    const [r0, o0] = anchors[i - 1], [r1, o1] = anchors[i];
    if (x <= r1) return o0 + (o1 - o0) * clamp01((x - r0) / (r1 - r0));
  }
  return anchors[anchors.length - 1][1];
};
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const eo = x => 1 - Math.pow(1 - x, 3);
const ei = x => x * x * x;
const eio = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const eob = (x, o = 1.4) => 1 + (o + 1) * Math.pow(x - 1, 3) + o * Math.pow(x - 1, 2);
const breathe = (t, amt = 0.012, period = 3.2) => 1 + amt * Math.sin(2 * Math.PI * t / period);

  fadeFromRight(el, t, t0, o = {}) {
    const stagger = o.stagger ?? 0.11, dur = o.dur ?? 0.5, dx = o.dx ?? 26;
    if (!el._words) {
      el._text = el.textContent.trim();
      const words = el._text.split(/\s+/);
      el.textContent = '';
      el._words = words.map((w, i) => {
        const s = document.createElement('span');
        s.textContent = w; s.style.display = 'inline-block';
        el.appendChild(s);
        if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
        return s.style;
      });
    }
    const times = SYNC && SYNC.words[el._text];
    el._words.forEach((s, i) => {
      const p = times ? eo(seg(REAL, times[i] - 0.12, times[i] + 0.23)) : eo(seg(t, t0 + i * stagger, t0 + i * stagger + dur));
      s.opacity = p; s.transform = 'translateX(' + (dx * (1 - p)) + 'px)';
    });
    return t0 + (el._words.length - 1) * stagger + dur;

};
const h = html => { const tp = document.createElement('template'); tp.innerHTML = html.trim(); return tp.content.firstElementChild; };
const DEFS = {};
const kit = { seg, lerp, eo, ei, eio, eob, breathe, TextFx, clamp01, h, scene(id, def) { DEFS[id] = def; } };

/* ---------- Dibujos compartidos ---------- */
window.UI = {

  chasm() {
    return '<path class="wash soft chasm-lw" d="M0 706 C200 696 400 704 700 700 L700 1080 L0 1080 Z"/>' +
      '<path class="wash soft chasm-rw" d="M1170 700 C1400 694 1700 706 1920 700 L1920 1080 L1170 1080 Z"/>' +

      '<path class="ink chasm-lt" pathLength="1" d="M0 706 C200 696 400 704 700 700"/>' +
      '<path class="ink chasm-rt" pathLength="1" d="M1170 700 C1400 694 1700 706 1920 700"/>' +
      '<path class="ink chasm-lf" pathLength="1" d="M700 700 L688 770 L712 850 L694 930 L708 1010 L698 1080"/>' +
      '<path class="ink chasm-rf" pathLength="1" d="M1170 700 L1184 770 L1160 850 L1178 930 L1162 1010 L1172 1080"/>' +

  },
  man(p) {
    return '<g class="' + p + '-man"><circle class="ink ' + p + '-m" pathLength="1" cx="0" cy="-150" r="26"/>' +

/* ====================== ESCENAS ====================== */
{ /* Título */
const { seg, eo, lerp, TextFx, breathe } = kit;
kit.scene('titulo', {
  init(kit) {
    kit.stage.append(kit.h('<div class="ground">' +

      '<path class="hatch titulo-d" pathLength="1" d="M740 766 C800 748 870 750 930 768 M740 784 C800 766 870 768 930 786 M990 768 C1050 750 1120 748 1180 766 M990 786 C1050 768 1120 766 1180 784"/>' +
      '<path class="wash warm titulo-hw" d="M960 700 C920 676 896 640 920 616 C938 600 956 612 960 628 C964 612 982 600 1000 616 C1024 640 1000 676 960 700 Z"/>' +
      '<path class="ink warm titulo-hi" pathLength="1" d="M960 700 C920 676 896 640 920 616 C938 600 956 612 960 628 C964 612 982 600 1000 616 C1024 640 1000 676 960 700 Z"/>' +
      '</g></svg>' +
      '<div class="words" style="left:160px;top:300px;width:1600px;text-align:center;align-items:center"><h2 class="line">El Plan de Salvación</h2></div>' +
      '<div class="rule titulo-rule" style="left:760px;top:440px;width:400px"></div></div>'));
    const q = s => kit.stage.querySelector(s);
    this.line = q('.line');
    this.rule = q('.titulo-rule').style;
    this.ink = q('.titulo-ink').style;
    this.pw = q('.titulo-pw').style;

    this.d = [...kit.stage.querySelectorAll('.titulo-d')].map(e => e.style);

      '<g clip-path="url(#amen-clip)"><g class="amen-sun">' +
      '<path class="ink thin warm amen-rays" pathLength="1" d="M960 740 L1300 540 M960 740 L620 540 M960 740 L1360 740 M960 740 L560 740 M960 740 L1180 500 M960 740 L740 500 M960 740 L1300 900 M960 740 L620 900"/>' +
      '<circle class="wash sun amen-sw" cx="960" cy="740" r="220"/><circle class="ink warm amen-si" pathLength="1" cx="960" cy="740" r="220"/></g></g>' +
      '<g class="amen-ink">' + UI.flower('amen') + '</g></svg>' +
      '<div class="words" style="left:160px;top:330px;width:1600px;text-align:center;align-items:center"><h2 class="line">En Cristo Jesús mi Salvador, Amén</h2></div>' +
      '<div class="rule amen-rule" style="left:760px;top:470px;width:400px"></div>' +
      '<p class="credito amen-credito">Texto bíblico: Reina-Valera 1960 © Sociedades Bíblicas en América Latina, 1960.<br>Renovado © Sociedades Bíblicas Unidas, 1988.</p></div>'));
    const q = s => kit.stage.querySelector(s);
    this.line = q('.line');
    this.rule = q('.amen-rule').style;
    this.credito = q('.amen-credito').style;
    this.glow = q('.amen-glow').style;
    this.ink = q('.amen-ink').style;
    this.sun = q('.amen-sun');
    this.sw = q('.amen-sw').style;
    this.si = q('.amen-si').style;
    this.rays = q('.amen-rays');
    this.plant = q('.amen-plant').style;
    this.head = q('.amen-head').style;
    q('.amen-bud').style.opacity = 0;
    for (const e of kit.stage.querySelectorAll('.amen-plant .ink, .amen-plant .hatch, .amen-gnd, .amen-mi')) e.style.strokeDashoffset = 0;
  },
  render(t) {
    TextFx.fadeFromRight(this.line, t, 0.1);
    this.rule.transform = 'scaleX(' + eo(seg(t, 1.2, 1.8)) + ')';
    this.credito.opacity = eo(seg(t, 2.2, 3.2));
    this.ink.transform = UI.J[Math.floor(t * 12) % 3];
    const rise = lerp(430, 0, eo(seg(t, 0.3, 2.6))) + Math.sin(t * 1.1) * 3;
    this.sun.setAttribute('transform', 'translate(0 ' + rise + ')');
    this.si.strokeDashoffset = 1 - eo(seg(t, 0.5, 1.5));
    this.sw.opacity = eo(seg(t, 0.9, 1.8));
    this.rays.style.strokeDashoffset = 1 - eo(seg(t, 1.9, 3.1));
    this.rays.setAttribute('transform', 'rotate(' + (t * 2) + ' 960 740)');
    this.head.transform = 'rotate(' + (Math.sin((t + 21) * 0.9) * 2) + 'deg)';
    this.plant.transform = 'rotate(' + (Math.sin((t + 21) * 1.1) * 1.2) + 'deg)';
    this.glow.opacity = lerp(0.3, 0.85, eo(seg(t, 0.5, 3.2)));
  },
});
}

/* ====================== REPRODUCTOR ====================== */
(function () {
  const player = document.getElementById('player'), frame = document.getElementById('frame'), stage = document.getElementById('stage');
  const big = document.getElementById('big'), pp = document.getElementById('pp'), bar = document.getElementById('bar'), fill = document.getElementById('fill'), timeEl = document.getElementById('time');
  const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M5 3l15 9-15 9z"/></svg>', ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
  const starts = []; let acc = 0;
  for (const s of SCENES) { starts.push(acc); acc += s.dur; }
  const kits = [], divs = [];
  const audio = AUDIO_SRC ? new Audio(AUDIO_SRC) : null;
  if (audio) audio.preload = 'auto';

  function build() {
    SCENES.forEach((s, i) => {
      const d = document.createElement('div'); d.className = 'scene'; stage.appendChild(d); divs.push(d);
      const k = Object.assign({}, kit, { stage: d, dur: s.dur, start: starts[i] }); kits.push(k);
      const def = DEFS[s.id]; if (def && def.init) def.init.call(def, k);
      const tick = document.createElement('div'); tick.className = 'tick'; tick.style.left = (starts[i] / TOTAL * 100) + '%'; tick.title = s.name; bar.appendChild(tick);
    });
  }
  let cur = -1;
  function show(T) {
    let i = SCENES.length - 1;
    for (let j = 0; j < SCENES.length; j++) if (T < starts[j] + SCENES[j].dur) { i = j; break; }
    if (i !== cur) { divs.forEach((d, j) => d.classList.toggle('on', j === i)); cur = i; }
    const def = DEFS[SCENES[i].id];
    const real = Math.min(T - starts[i], SCENES[i].dur), sync = SYNC && SYNC.scenes[SCENES[i].id];
    REAL = real;
    if (def) def.render.call(def, sync ? warp(sync.anchors, real) : real, kits[i]);
    if (sync) for (const [name, at] of Object.entries(sync.marks)) kits[i].stage.querySelector('.' + name).style.opacity = eo(seg(real, at - 0.1, at + 0.4));
  }
  function fit() {
    const W = player.clientWidth, H = player.clientHeight, s = Math.min(W / 1920, H / 1080);
    frame.style.transform = 'translate(' + ((W - 1920 * s) / 2) + 'px,' + ((H - 1080 * s) / 2) + 'px) scale(' + s + ')';
  }
  const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
  let T = 0, playing = false, last = 0;
  function ui() {
    fill.style.width = (T / TOTAL * 100) + '%';
    timeEl.textContent = fmt(T) + ' / ' + fmt(TOTAL);
    pp.innerHTML = playing ? ICON_PAUSE : ICON_PLAY;
    big.classList.toggle('hide', playing);
    player.classList.toggle('paused', !playing);
  }
  function play() {
    if (T >= TOTAL) T = 0;
    playing = true; last = performance.now();
    if (audio) { audio.currentTime = T; audio.play().catch(() => { playing = false; ui(); }); }
    ui();
  }
  function pause() { playing = false; if (audio) audio.pause(); ui(); }
  function seek(t) { T = Math.max(0, Math.min(TOTAL, t)); if (audio) audio.currentTime = T; show(T); ui(); }
  function loop(now) {
    if (playing) {
      if (audio && !audio.paused) T = audio.currentTime;
      else T += Math.min(0.1, (now - last) / 1000);
      last = now;
      if (T >= TOTAL) { T = TOTAL; playing = false; if (audio) audio.pause(); }
      show(T); ui();
    }
    requestAnimationFrame(loop);
  }
  big.addEventListener('click', play);
  pp.addEventListener('click', () => playing ? pause() : play());
  stage.addEventListener('click', () => playing ? pause() : play());
  let drag = false;
  const barSeek = e => { const r = bar.getBoundingClientRect(); seek((e.clientX - r.left) / r.width * TOTAL); };
  bar.addEventListener('pointerdown', e => { drag = true; bar.setPointerCapture(e.pointerId); barSeek(e); });
  bar.addEventListener('pointermove', e => { if (drag) barSeek(e); });
  bar.addEventListener('pointerup', () => { drag = false; });
  player.addEventListener('touchstart', () => player.classList.add('touch'), { passive: true });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); }
    else if (e.code === 'ArrowRight') seek(T + 5);
    else if (e.code === 'ArrowLeft') seek(T - 5);
  });
  window.addEventListener('resize', fit);
  window.PLAYER = { play, pause, seek, get time() { return T; }, get duration() { return TOTAL; } };

  build(); fit();
  const start = () => { show(0); ui(); requestAnimationFrame(loop); if (AUTOPLAY) play(); };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
})();
</script>
